[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-chat"
version = "0.1.0"
description = "CLI YouTube Video Intelligence Assistant — grounded Q&A over video captions with timestamp citations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pranav Gupta" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "youtube-transcript-api>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0", "faiss-cpu>=1.8"]
llm        = ["google-generativeai>=0.7", "openai>=1.30"]
metadata   = ["yt-dlp>=2024.7.1"]
eval       = ["ragas>=0.1.10", "deepeval>=0.21", "pandas>=2.2", "datasets>=2.19"]
dev        = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]
all        = ["yt-chat[embeddings,llm,metadata,eval,dev]"]

[project.scripts]
yt-chat = "ytchat.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ytchat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["network: requires internet (deselected by default)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true